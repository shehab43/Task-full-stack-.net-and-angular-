<div class="container mt-4">
  <h2>Employee List</h2>
  <a routerLink="/employee/add" class="btn btn-primary mb-3">Add New Employee</a>

  <table class="table table-striped">
    <thead>
      <tr>
        <th>firstName</th>
        <th>lastName</th>
        <th>Email</th>
        <th>Position</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let employee of employees">
        <td>{{ employee.firstName }}</td>
        <td>{{ employee.lastName }}</td>
        <td>{{ employee.email }}</td>
        <td>{{ employee.position }}</td>
        <td>
          <a [routerLink]="['/employee/edit', employee.id]" class="btn btn-sm btn-info me-2">Edit</a>
          <button (click)="deleteEmployee(employee.id)" class="btn btn-sm btn-danger">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
